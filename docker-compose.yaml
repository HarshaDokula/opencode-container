services:
  opencode:
    # Local image = upstream opencode + git (see Dockerfile).
    # pull_policy: build => never try to pull from a registry, always
    # build locally (avoids "pull access denied" noise for local images).
    build: .
    image: local/opencode:latest
    pull_policy: build

    working_dir: /workspace

    stdin_open: true
    tty: true

    env_file:
      - .env

    environment:
      # Provider API keys — sourced from .env via docker compose interpolation
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}

    volumes:
      - ${WORK_DIR:-./workspace}:/workspace
      - ./config:/root/.config/opencode
      # opencode stores `/connect` credentials in its DATA dir
      # (auth.json under ~/.local/share/opencode), not the config dir.
      # Persist it here or logins are lost when the container is removed.
      - ./data:/root/.local/share/opencode
